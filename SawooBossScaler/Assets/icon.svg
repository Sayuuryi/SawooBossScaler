<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.62" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#6a3299"/>
      <stop offset="0.5" stop-color="#2c164d"/>
      <stop offset="1" stop-color="#0c0a1a"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.45" stop-color="#d9a446"/>
      <stop offset="1" stop-color="#7a4d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c8a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.4" stop-color="#e8b04c"/>
      <stop offset="1" stop-color="#8a5317"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a32"/>
      <stop offset="1" stop-color="#6b3c0e"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9c8660"/>
      <stop offset="0.6" stop-color="#eadfc6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd3e0"/>
      <stop offset="0.4" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#7a0026"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- helmet outline only, used for the "old size" -->
    <path id="helmShape" d="M100,36 C140,36 162,64 164,104 L160,140 C154,164 132,182 100,196 C68,182 46,164 40,140 L36,104 C38,64 60,36 100,36 Z"/>
    <path id="hornR" d="M132,86 C156,70 176,44 178,4 C198,40 192,90 152,118 Z"/>
    <path id="hornL" d="M68,86 C44,70 24,44 22,4 C2,40 8,90 48,118 Z"/>

    <g id="helm" stroke="#2a1407" stroke-width="5" stroke-linejoin="round">
      <use xlink:href="#hornR" fill="url(#horn)"/>
      <use xlink:href="#hornL" fill="url(#horn)"/>
      <use xlink:href="#helmShape" fill="url(#metal)"/>
      <!-- cheek plates -->
      <path d="M40,140 C52,150 64,160 74,178 C58,172 46,160 40,140 Z" fill="url(#metalDark)" stroke-width="3"/>
      <path d="M160,140 C148,150 136,160 126,178 C142,172 154,160 160,140 Z" fill="url(#metalDark)" stroke-width="3"/>
      <!-- crest -->
      <path d="M100,14 L114,54 L100,98 L86,54 Z" fill="#fff6d6"/>
      <!-- visor -->
      <path d="M50,108 C78,94 122,94 150,108 L143,130 C120,121 80,121 57,130 Z" fill="#170811"/>
      <!-- jaw -->
      <path d="M100,134 L100,184" fill="none" stroke-width="4"/>
      <path d="M80,148 L100,180 L120,148" fill="none" stroke-width="4"/>
      <!-- forehead gem -->
      <ellipse cx="100" cy="76" rx="10" ry="12" fill="url(#gem)" stroke-width="3"/>
      <!-- shine -->
      <path d="M62,62 C72,50 86,44 98,42" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="eyes">
      <g filter="url(#soft)">
        <ellipse cx="79" cy="114" rx="18" ry="8" fill="#ff2f55"/>
        <ellipse cx="121" cy="114" rx="18" ry="8" fill="#ff2f55"/>
      </g>
      <ellipse cx="79" cy="114" rx="13" ry="4" fill="#ffd0d9"/>
      <ellipse cx="121" cy="114" rx="13" ry="4" fill="#ffd0d9"/>
    </g>
    <mask id="outsideHelm" maskUnits="userSpaceOnUse" x="-50" y="-50" width="300" height="300">
      <rect x="-50" y="-50" width="300" height="300" fill="#ffffff"/>
      <use xlink:href="#helmShape" fill="#000000" stroke="#000000" stroke-width="3"/>
    </mask>
    <g id="sparkle">
      <path d="M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3 Z" fill="#fff4cf"/>
    </g>
  </defs>

  <!-- tile -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#frame)" stroke-width="10"/>
  <rect x="31" y="31" width="450" height="450" rx="88" fill="none" stroke="#ffe7a3" stroke-opacity="0.16" stroke-width="2"/>

  <!-- the size it had: dashed outline -->
  <circle cx="300" cy="200" r="200" fill="url(#glow)"/>
  <g transform="translate(150,40) scale(1.6)" fill="#ffffff" fill-opacity="0.05" stroke="#ffe3a8" stroke-opacity="0.75" stroke-width="3.6" stroke-dasharray="9 7" stroke-linejoin="round">
    <g mask="url(#outsideHelm)">
      <use xlink:href="#hornR"/>
      <use xlink:href="#hornL"/>
    </g>
    <use xlink:href="#helmShape"/>
  </g>

  <!-- shrink arrow -->
  <path d="M376,282 C372,346 330,384 270,396" fill="none" stroke="#2a1407" stroke-width="22" stroke-linecap="round" opacity="0.5"/>
  <path d="M376,282 C372,346 330,384 270,396" fill="none" stroke="#ffd98a" stroke-width="14" stroke-linecap="round"/>
  <path d="M282,362 L236,402 L292,428 Z" fill="#ffd98a" stroke="#2a1407" stroke-width="4" stroke-linejoin="round"/>

  <!-- the size you picked -->
  <ellipse cx="130" cy="452" rx="84" ry="14" fill="#000000" opacity="0.45" filter="url(#shadow)"/>
  <g transform="translate(48,250) scale(0.98)">
    <use xlink:href="#helm"/>
    <use xlink:href="#eyes"/>
  </g>

  <use xlink:href="#sparkle" transform="translate(232,236) scale(1.1)"/>
  <use xlink:href="#sparkle" transform="translate(64,214) scale(0.7)"/>
  <use xlink:href="#sparkle" transform="translate(430,410) scale(0.8)"/>
</svg>
